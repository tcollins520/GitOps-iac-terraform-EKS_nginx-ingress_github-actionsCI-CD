name: "Vproapp IAC"

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'terraform/**'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AWS_REGION: us-east-1
  EKS_CLUSTER: vproapp-gitops-eks

jobs:
  terraform:
    name: "Apply Terraform Code Changes"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:

      # Checkout Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Terraform Version
      - name: Terraform Version
        run: terraform version

      # Terraform Init
      - name: Terraform Init
        id: init
        run: terraform init -backend-config="bucket=${{ env.BUCKET_TF_STATE }}"

      # Terraform Format
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      # Terraform Validate
      - name: Terraform Validate
        id: validate
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan

      # Fail Workflow if Plan Fails
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Terraform Apply
      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan

      # Configure kubectl for EKS
      - name: Update kubeconfig
        id: kubeconfig
        if: steps.apply.outcome == 'success'
        run: |
          aws eks update-kubeconfig \
          --region ${{ env.AWS_REGION }} \
          --name ${{ env.EKS_CLUSTER }}

      # Verify Cluster
      - name: Verify Cluster
        if: steps.kubeconfig.outcome == 'success'
        run: kubectl get nodes

      # Install NGINX Ingress Controller
      - name: Install NGINX Ingress Controller
        if: steps.kubeconfig.outcome == 'success'
        run: |
          kubectl apply -f \
          https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/aws/deploy.yaml

      # Verify Ingress Controller
      - name: Verify Ingress Controller
        if: steps.kubeconfig.outcome == 'success'
        run: kubectl get pods -n ingress-nginx